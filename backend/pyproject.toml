[project]
name = "twinpilot-api"
version = "0.1.0"
description = "TwinPilot API foundation"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.4",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.1",
  "pydantic-settings>=2.10.1",
  "qdrant-client>=1.15.1",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.42",
  "uvicorn[standard]>=0.35.0",
]

[tool.uv]
package = false
dev-dependencies = [
  "httpx>=0.28.1",
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "ruff>=0.12.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
mypy_path = ["."]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
