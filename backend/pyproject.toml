[project]
name = "twinpilot-backend"
version = "0.1.0"
description = "Backend for TwinPilot - Your AI Engineering Twin"
readme = "../README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    # Settings
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    # Database
    "sqlalchemy>=2.0.41",
    "asyncpg>=0.30.0",
    "alembic>=1.16.4",
    # Redis
    "redis>=6.2.0",
    # Vector Database
    "qdrant-client>=1.15.0",
    # Logging
    "structlog>=25.4.0",
    "rich>=14.1.0",
    # Environment
    "python-dotenv>=1.1.1",
    # Utilities
    "httpx>=0.28.1",
    "orjson>=3.11.0",
    # Git
    "GitPython>=3.1.45",
    # MCP
    "mcp>=1.12.3",
    # LLM
    "litellm>=1.74.9",
    # Validation
    "email-validator>=2.2.0",
    "greenlet>=3.5.4",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",

    "ruff>=0.12.5",
    "black>=25.1.0",
    "mypy>=1.17.1",

    "pre-commit>=4.2.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
