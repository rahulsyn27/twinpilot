services:
  postgres:
    image: postgres:16

    container_name: twinpilot-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: twinpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: twinpilot-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest

    container_name: twinpilot-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: